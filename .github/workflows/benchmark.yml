name: Model Benchmark (dry-run)

# Compares qwen/qwen3.6-27b (Groq) vs gemini-2.5-flash (Google) on the same
# content task. DRY_RUN=1: generates the batch, prints the JSON plan,
# schedules NOTHING and never calls Meta. Run manually from Actions →
# Model Benchmark (dry-run).
#
# NOTE: each run generates a full batch (default 10 long-form posts), which is
# ~10 LLM calls. On Groq's free tier, consider `python app.py --plan-only
# --batch 2` for a quick spot-check instead.

on:
  workflow_dispatch:

concurrency:
  group: zyntrix-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Benchmark — Groq qwen3.6-27b (dry-run)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.6-27b
          DRY_RUN: "1"
        run: python app.py

      - name: Benchmark — Google gemini-2.5-flash (dry-run)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DRY_RUN: "1"
        run: python app.py

      - name: Fallback test — force Groq failure, expect Gemini rescue (dry-run)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.6-does-not-exist-999
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DRY_RUN: "1"
        run: python app.py
