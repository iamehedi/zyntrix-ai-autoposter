name: Zyntrix AI Facebook Autoposter

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 12:00 UTC (6:00 PM Bangladesh Time - UTC+6)
    # Note: GitHub scheduled actions may occasionally experience slight delays depending on runner queue load.
    - cron: "0 12 * * *"

jobs:
  autopost:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autoposter Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ secrets.GRAPH_API_VERSION || 'v20.0' }}
        run: python app.py

      - name: Commit and Push Queue Updates
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet topics.txt; then
            git add topics.txt
            git commit -m "chore: update topic queue [skip ci]"
            git push
          else
            echo "No changes in topics.txt to commit."
          fi
