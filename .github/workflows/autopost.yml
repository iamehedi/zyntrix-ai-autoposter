name: Zyntrix AI Facebook Autoposter

on:
  workflow_dispatch:
  schedule:
    # 5 posts per day, spaced ~3 hours apart, in Bangladesh Time (UTC+6):
    #   03:00 UTC = 09:00 AM, 06:00 UTC = 12:00 PM, 10:00 UTC = 04:00 PM,
    #   13:00 UTC = 07:00 PM, 15:00 UTC = 09:00 PM
    # Note: GitHub scheduled actions may occasionally experience slight delays depending on runner queue load.
    - cron: "0 3,6,10,13,15 * * *"

# Prevent overlapping runs (e.g. manual trigger + scheduled cron) from posting the same topic twice.
# cancel-in-progress: false makes a new run WAIT for the in-progress one to finish instead of killing it
# mid-publish (killing a run after a successful publish but before the queue update would double-post).
concurrency:
  group: zyntrix-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autoposter Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ secrets.GRAPH_API_VERSION || 'v20.0' }}
        run: python app.py

      - name: Commit and Push Queue Updates
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet topics.txt post_history.json; then
            git add topics.txt post_history.json
            git commit -m "chore: update topic queue and post history [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
