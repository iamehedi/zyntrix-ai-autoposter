name: Zyntrix AI Facebook Autoposter

on:
  # One run per day is enough: posts are SCHEDULED via Meta's Graph API
  # (published=false + scheduled_publish_time), so exact publish timing no
  # longer depends on when GitHub fires — Meta publishes at the scheduled
  # Asia/Dhaka slot (08:00 / 12:00 / 17:00 / 20:00 / 22:00).
  # 02:30 UTC = 08:30 Asia/Dhaka: each daily run schedules the next 2 days.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

# Prevent overlapping runs (e.g. manual trigger + scheduled cron) from assigning
# the same publishing slot twice.
# cancel-in-progress: false makes a new run WAIT for the in-progress one to
# finish instead of killing it mid-schedule.
concurrency:
  group: zyntrix-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Content Engine & Meta Scheduler
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'qwen/qwen3.6-27b' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ secrets.GRAPH_API_VERSION || 'v20.0' }}
        run: python app.py

      - name: Commit and Push Post History
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet post_history.json content_plan.json; then
            git add post_history.json content_plan.json
            git commit -m "chore: update post history and content plan [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
